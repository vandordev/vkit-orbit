version: "3"

tasks:
  default:
    desc: Show available commands
    cmds:
      - task --list

  install:
    desc: Install Bun and Go dependencies
    cmds:
      - bun install --ignore-scripts
      - go mod download

  doctor:
    desc: Verify required tools and local runtime configuration
    cmds:
      - |
        proxy test -f .env || { proxy echo "missing .env; run: cp .env.example .env" >&2; exit 1; }
        go version >/dev/null
        bun --version >/dev/null
        task --version >/dev/null
        docker compose version >/dev/null
        go test ./apps/migrate -run TestRunAppliesPrismaBeforeRiver -count=1

  dev:
    desc: Run TanStack Start with embedded Elysia
    cmds:
      - bun run dev:web

  dev:bg:
    desc: Run worker, scheduler, and realtime in the foreground with interleaved logs
    deps:
      - dev:worker
      - dev:scheduler
      - dev:realtime

  dev:web:
    desc: Run TanStack Start with embedded Elysia
    cmds:
      - bun run dev:web

  dev:worker:
    desc: Run the Go River worker with Air
    cmds:
      - go tool air -c dev/air/worker.toml

  dev:scheduler:
    desc: Run the Bun River scheduler
    cmds:
      - bun run dev:scheduler

  dev:realtime:
    desc: Run the Socket.IO runtime
    cmds:
      - bun run dev:realtime

  start:
    desc: Start the built web app
    cmds:
      - bun run start:web

  start:jobs:
    desc: Start the Go worker and Bun scheduler
    cmds:
      - task --parallel --output=interleaved start:worker start:scheduler

  start:worker:
    desc: Start the built Go worker
    cmds:
      - go run ./apps/worker

  start:scheduler:
    desc: Start the built Bun scheduler
    cmds:
      - bun run start:scheduler

  start:realtime:
    desc: Start the built Socket.IO runtime
    cmds:
      - bun run start:realtime

  migrate:
    desc: Apply Prisma and River migrations
    cmds:
      - bun --env-file=.env run packages/config/src/run.ts --modules base -- go run ./apps/migrate

  test:
    desc: Run TypeScript and Go tests
    cmds:
      - bun test apps/api apps/web apps/scheduler apps/realtime packages
      - go test ./... -count=1

  test:go:
    desc: Run Go tests
    cmds:
      - go test ./... -count=1

  quality:
    desc: Run tests, lint, typechecks, and Go vet
    cmds:
      - task test
      - bun run lint
      - bun run check-types
      - go vet ./...

  build:
    desc: Build TypeScript and Go runtimes
    cmds:
      - bun run build
      - task build:go

  build:go:
    desc: Build the Go worker and migration runtime
    cmds:
      - go build ./apps/worker ./apps/migrate

  lint:
    desc: Lint all TypeScript workspaces
    cmds:
      - bun run lint

  check-types:
    desc: Typecheck all TypeScript workspaces
    cmds:
      - bun run check-types

  db:generate:
    desc: Generate the Prisma client
    dir: packages/database
    cmds:
      - bun run db:generate

  db:migrate:
    desc: Apply Prisma migrations through the migration runtime
    cmds:
      - task migrate

  web:health:
    desc: Check the embedded Elysia health endpoint
    cmds:
      - curl --fail http://localhost:4100/health

  api:status:
    desc: Check the embedded Elysia status endpoint
    cmds:
      - curl --fail http://localhost:4100/api/status

  compose:up:
    desc: Build and run db, migrate, and web
    cmds:
      - docker compose up --build

  compose:up:detached:
    desc: Build and run the default stack in the background
    cmds:
      - docker compose up --build -d

  compose:jobs:
    desc: Build and run optional Go worker and Bun scheduler
    cmds:
      - docker compose --profile jobs up --build

  compose:realtime:
    desc: Build and run optional Socket.IO runtime
    cmds:
      - docker compose --profile realtime up --build

  compose:down:
    desc: Stop the Compose stack
    cmds:
      - docker compose down

  compose:logs:
    desc: Follow Compose logs
    cmds:
      - docker compose logs -f
