version: "3"
tasks:
  default:
    desc: Show available commands
    cmds: [task --list]
  install:
    desc: Install Bun dependencies
    cmds: [bun install --ignore-scripts]
  doctor:
    desc: Verify required tools and local runtime configuration
    cmds:
      - test -f .env
      - bun --version >/dev/null
      - task --version >/dev/null
      - docker compose version >/dev/null
  dev:
    desc: Run the web runtime
    cmds: [bun run dev:web]
  dev:web:
    desc: Run TanStack Start
    cmds: [bun run dev:web]
  dev:storybook:
    desc: Run the shared Storybook on port 6006
    cmds: [bun --no-env-file run dev:storybook]
  build:storybook:
    desc: Build the shared Storybook static preview
    cmds: [bun --no-env-file run build:storybook]
  dev:worker:
    desc: Run the TypeScript worker
    cmds: [bun run --cwd apps/worker dev]
  dev:scheduler:
    desc: Run the scheduler
    cmds: [bun run dev:scheduler]
  dev:realtime:
    desc: Run realtime
    cmds: [bun run dev:realtime]
  start:
    desc: Start web
    cmds: [bun run start:web]
  start:worker:
    desc: Start worker
    cmds: [bun run start:worker]
  start:scheduler:
    desc: Start scheduler
    cmds: [bun run start:scheduler]
  start:realtime:
    desc: Start realtime
    cmds: [bun run start:realtime]
  start:migrate:
    desc: Apply Prisma migrations
    cmds: [bun run start:migrate]
  migrate:
    desc: Apply Prisma migrations
    cmds: [bun --no-env-file run --cwd apps/migrate dev]
  test:
    desc: Run TypeScript tests
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://test:test@127.0.0.1:1/orbit_test
      REDIS_KEY_PREFIX: orbit:test:unit
    cmds: [bun --no-env-file test apps packages scripts --path-ignore-patterns=apps/web/e2e]
  quality:
    desc: Run tests, lint, and typechecks
    cmds:
      - bun run check:architecture
      - bun run format:check
      - task test
      - bun run lint
      - bun run check-types
  build:
    desc: Build TypeScript runtimes
    cmds: [bun run build]
  format:
    desc: Format TypeScript and Markdown
    cmds: [bun run format]
  format:check:
    desc: Check formatting
    cmds: [bun run format:check]
  lint:
    desc: Lint TypeScript
    cmds: [bun run lint]
  check-types:
    desc: Typecheck TypeScript
    cmds: [bun run check-types]
  db:generate:
    desc: Generate Prisma client
    dir: packages/db
    cmds: [bun run db:generate]
  db:migrate:
    desc: Apply Prisma migrations
    cmds: [task migrate]
  compose:up:
    desc: Run Compose stack
    cmds: [docker compose up --build]
  compose:up:detached:
    desc: Run Compose stack in background
    cmds: [docker compose up --build -d]
  compose:down:
    desc: Stop Compose stack
    cmds: [docker compose down]
  compose:smoke:
    desc: Run the complete real-stack Compose and browser acceptance gate
    cmds: [bun --no-env-file run scripts/compose-smoke.ts]
