services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: boilerplate
      POSTGRES_USER: boilerplate
      POSTGRES_PASSWORD: boilerplate
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boilerplate -d boilerplate"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - redis-data:/data
      - ./deploy/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:RELEASE.2025-02-28T09-55-16Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: quay.io/minio/minio:RELEASE.2025-02-28T09-55-16Z
    entrypoint: ["/bin/sh", "-c"]
    command: ["mc alias set local http://minio:9000 minio minio123 && mc mb --ignore-existing local/documents"]
    depends_on:
      minio:
        condition: service_healthy

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    environment:
      DATABASE_URL: postgresql://boilerplate:boilerplate@db:5432/boilerplate
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    env_file: [.env]
    environment:
      NODE_ENV: production
      WEB_PORT: 4100
      WEB_HOST: 0.0.0.0
      DATABASE_URL: postgresql://boilerplate:boilerplate@db:5432/boilerplate
      WORKER_NOTIFICATION_API_KEY: ${WORKER_NOTIFICATION_API_KEY:-local-worker-key}
      REALTIME_INTERNAL_URL: http://realtime:4102
      REALTIME_PUBLISH_API_KEY: ${REALTIME_PUBLISH_API_KEY:-local-realtime-key}
      REALTIME_URL: ${REALTIME_URL:-http://localhost:4102}
      REALTIME_TICKET_SECRET: ${REALTIME_TICKET_SECRET:-local-ticket-secret}
      S3_BUCKET: documents
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: minio
      S3_SECRET_ACCESS_KEY: minio123
      S3_ENDPOINT: http://minio:9000
      S3_ROOT_PREFIX: uploads
    ports: ["4100:4100"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'bun -e "fetch(''http://127.0.0.1:4100/health'').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: [.env]
    environment:
      NODE_ENV: production
      API_PORT: 4101
      DATABASE_URL: postgresql://boilerplate:boilerplate@db:5432/boilerplate
      REALTIME_INTERNAL_URL: http://realtime:4102
      REALTIME_PUBLISH_API_KEY: ${REALTIME_PUBLISH_API_KEY:-local-realtime-key}
      WORKER_NOTIFICATION_API_KEY: ${WORKER_NOTIFICATION_API_KEY:-local-worker-key}
      S3_BUCKET: documents
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: minio
      S3_SECRET_ACCESS_KEY: minio123
      S3_ENDPOINT: http://minio:9000
      S3_ROOT_PREFIX: uploads
    ports: ["4101:4101"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'bun -e "fetch(''http://127.0.0.1:4101/health/live'').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://boilerplate:boilerplate@db:5432/boilerplate
      REDIS_URL: redis://redis:6379
      S3_BUCKET: documents
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: minio
      S3_SECRET_ACCESS_KEY: minio123
      WORKER_NOTIFICATION_URL: http://api:4101/internal/worker-events
      WORKER_NOTIFICATION_API_KEY: ${WORKER_NOTIFICATION_API_KEY:-local-worker-key}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      api:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.scheduler
    env_file: [.env]
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

  realtime:
    build:
      context: .
      dockerfile: Dockerfile.realtime
    env_file: [.env]
    environment:
      REALTIME_PORT: 4102
      REALTIME_TICKET_SECRET: ${REALTIME_TICKET_SECRET:-local-ticket-secret}
      REALTIME_PUBLISH_API_KEY: ${REALTIME_PUBLISH_API_KEY:-local-realtime-key}
      REALTIME_CORS_ORIGIN: ${REALTIME_CORS_ORIGIN:-http://localhost:4100}
    ports: ["4102:4102"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'bun -e "fetch(''http://127.0.0.1:4102/health'').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  minio-data:
